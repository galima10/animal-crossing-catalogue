services:
  db:
    image: postgres:18-alpine
    container_name: animal-crossing-catalogue-db
    environment:
      POSTGRES_USER: animal_crossing_user
      POSTGRES_PASSWORD: toto1234
      POSTGRES_DB: animal_crossing_db
    ports:
      # - "5432:5432"
      - "5433:5432"
    volumes:
      - animal_crossing_catalogue_data:/var/lib/postgresql

volumes:
  animal_crossing_catalogue_data: