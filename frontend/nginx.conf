# Configure the nginx server
server {
    # Nginx port
    listen 80;
    # Where the static frontend files are
    root /usr/share/nginx/html;
    # Use the index.html to serve the frontend
    index index.html;

    # Reverse proxy for backend /api
    location /api/ {
        # In the internal docker network, the backend service is named backend (like db in the db url @db:5432)
        proxy_pass http://backend:3000;
        # Nginx header vars
        # Request domain
        proxy_set_header Host $host;
        # Client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # http/https
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend: fallback SPA : the paths like /villagers/12 aren't files, it serves index.html and React Router displays the correct page
    location / {
        # Try to serve the $uri, else, the $uri/ folder (with its index.html thanks to the index directive (server block)), else, serve /index.html
        try_files $uri $uri/ /index.html;
    }
}

